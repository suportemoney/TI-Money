{% if letreiro_mensagens %}
<style>
@keyframes letreiro-scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-100%); }
}
.letreiro-wrap {
    overflow: hidden;
}
.letreiro-track {
    display: inline-block;
    white-space: nowrap;
    padding-left: 100%;
    animation: letreiro-scroll 22s linear infinite;
    color: #dc2626;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-shadow: none;
}
.letreiro-wrap:hover .letreiro-track {
    animation-play-state: paused;
}
</style>
<div class="letreiro-wrap flex-1 min-w-0 mx-3 md:mx-6 bg-transparent px-0 py-1"
     id="helpdesk-letreiro"
     title="Comunicados do letreiro — Central Informativa">
    <div class="letreiro-track text-base md:text-lg">
        {% for m in letreiro_mensagens %}
        <span class="inline-block px-4">{{ m.text|truncatechars:160 }}</span>{% if not forloop.last %}<span class="inline-block px-2" aria-hidden="true"> · </span>{% endif %}
        {% endfor %}
    </div>
</div>
{% else %}
<div class="flex-1 min-w-0 mx-3 md:mx-6 hidden md:block" aria-hidden="true"></div>
{% endif %}
