{% load helpdesk_permissions %}
<style>
@keyframes letreiro-scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-100%); }
}
.letreiro-track {
    display: inline-block;
    white-space: nowrap;
    padding-left: 100%;
    animation: letreiro-scroll 22s linear infinite;
    color: #dc2626;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-shadow: none;
}
.letreiro-wrap:hover .letreiro-track {
    animation-play-state: paused;
}
</style>
{# Slot estável: HTMX troca só o miolo quando o poll/criação dispara letreiroUpdated #}
<div id="helpdesk-letreiro-slot"
     class="flex-1 min-w-0 mx-3 md:mx-6"
     hx-get="{% url 'helpdesk:informative_letreiro' %}?v={% helpdesk_v %}"
     hx-trigger="letreiroUpdated from:body"
     hx-swap="innerHTML">
    {% include "helpdesk/_letreiro_inner.html" %}
</div>
