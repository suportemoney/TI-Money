{# Seletor multi-select de funil (filtro do kanban e triagem). #}
<div class="funnel-ms relative {% if funnel_wide %}w-full{% else %}w-full max-w-md{% endif %}"
     data-funnel-ms
     data-mode="{{ funnel_mode|default:'form' }}"
     data-placeholder="{{ funnel_placeholder|default:'Sem funil' }}">
    <button type="button"
            data-funnel-toggle
            class="w-full min-h-[38px] text-sm px-3 py-2 border border-slate-300 rounded-lg bg-white hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-fuchsia-500 focus:border-fuchsia-400 transition-colors flex items-center justify-between gap-2 text-left">
        <span data-funnel-summary class="flex-1 min-w-0 flex flex-wrap gap-1 items-center text-slate-500">{{ funnel_placeholder|default:'Sem funil' }}</span>
        <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
    </button>
    <div data-funnel-panel class="hidden absolute z-[80] mt-1 w-full min-w-[16rem] bg-white border border-slate-200 rounded-lg shadow-lg overflow-hidden">
        <div class="p-2 border-b border-slate-100">
            <input type="search" data-funnel-search placeholder="Buscar funil..." autocomplete="off"
                   class="w-full text-sm p-2 border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-fuchsia-500">
        </div>
        <div class="max-h-56 overflow-y-auto py-1">
            {% for t in funnel_options %}
            {% if funnel_use_slug %}
            {% with val=t.slug %}
            <label data-funnel-row data-search="{{ t.nome|lower }}"
                   class="flex items-center gap-2 px-3 py-1.5 text-sm hover:bg-fuchsia-50 cursor-pointer text-slate-700">
                <input type="checkbox"
                       {% if funnel_input_name %}name="{{ funnel_input_name }}"{% endif %}
                       value="{{ val }}"
                       {% if val in funnel_selected %}checked{% endif %}
                       data-funnel-option
                       data-label="{{ t.nome }}"
                       class="rounded border-slate-300 text-fuchsia-600 focus:ring-fuchsia-500">
                <span class="truncate">#{{ t.nome }}</span>
            </label>
            {% endwith %}
            {% else %}
            {% with val=t.id|stringformat:'s' %}
            <label data-funnel-row data-search="{{ t.nome|lower }}"
                   class="flex items-center gap-2 px-3 py-1.5 text-sm hover:bg-fuchsia-50 cursor-pointer text-slate-700">
                <input type="checkbox"
                       {% if funnel_input_name %}name="{{ funnel_input_name }}"{% endif %}
                       value="{{ t.id }}"
                       {% if val in funnel_selected or t.id in funnel_selected %}checked{% endif %}
                       data-funnel-option
                       data-label="{{ t.nome }}"
                       class="rounded border-slate-300 text-fuchsia-600 focus:ring-fuchsia-500">
                <span class="truncate">#{{ t.nome }}</span>
            </label>
            {% endwith %}
            {% endif %}
            {% empty %}
            <p class="px-3 py-2 text-xs text-slate-400">Nenhuma tag de funil cadastrada.</p>
            {% endfor %}
        </div>
        <div class="px-3 py-2 border-t border-slate-100 flex justify-end">
            <button type="button" data-funnel-clear class="text-xs font-medium text-slate-500 hover:text-fuchsia-700">Limpar</button>
        </div>
    </div>
</div>
