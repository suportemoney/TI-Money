<div id="gestor-wizard-root">
    <button type="button" id="gestor-wizard-fab" title="Wizard de gestão"
            aria-expanded="false" aria-controls="gestor-wizard-panel">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
    </button>

    <div id="gestor-wizard-panel">
        <div id="gestor-wizard-sheet">
            <div id="gestor-wizard-header">
                <div id="gestor-wizard-header-left">
                    <div id="gestor-wizard-badge" aria-hidden="true">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                    <div>
                        <h2>Wizard de gestão</h2>
                        <p>DeepSeek · vê a página atual</p>
                    </div>
                </div>
                <div id="gestor-wizard-actions">
                    <button type="button" id="gestor-wizard-limpar" title="Nova conversa">Limpar</button>
                    <button type="button" id="gestor-wizard-fechar" title="Fechar" aria-label="Fechar wizard">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            <div id="gestor-wizard-msgs">
                <div id="gestor-wizard-vazio">
                    <i class="fa-regular fa-comments"></i>
                    Descreva o que fazer nesta tela ou anexe print, PDF, CSV ou XLSX.
                    Alteração no discador só depois de Confirmar.
                </div>
            </div>
            <div id="gestor-wizard-barra">
                <span id="gestor-wizard-barra-txt">Alterações pendentes</span>
                <div class="gestor-wizard-acoes">
                    <button type="button" class="gestor-wizard-recusar" id="gestor-wizard-barra-recusar">Recusar</button>
                    <button type="button" class="gestor-wizard-cta" id="gestor-wizard-barra-btn">Confirmar</button>
                </div>
            </div>
            <form id="gestor-wizard-form">
                <textarea id="gestor-wizard-input" rows="3" maxlength="4000"
                          placeholder="Ex.: nessa tabela, libere os acessos inativos…"></textarea>
                <div id="gestor-wizard-files" hidden></div>
                <div id="gestor-wizard-form-row">
                    <div id="gestor-wizard-form-left">
                        <input type="file" id="gestor-wizard-file" multiple hidden
                               accept=".csv,.xlsx,.xls,.pdf,.png,.jpg,.jpeg,.webp,.gif,.bmp,image/*,application/pdf">
                        <button type="button" id="gestor-wizard-anexar" title="Anexar print, PDF, CSV ou XLSX">
                            <i class="fa-solid fa-paperclip"></i> Anexar
                        </button>
                        <p id="gestor-wizard-hint">Enter envia · Shift+Enter quebra linha</p>
                    </div>
                    <button type="submit" id="gestor-wizard-enviar">Enviar</button>
                </div>
            </form>
            <p id="gestor-wizard-status">Pensando…</p>
        </div>
    </div>
</div>

<script>
(function () {
    const fab = document.getElementById('gestor-wizard-fab');
    const panel = document.getElementById('gestor-wizard-panel');
    const msgs = document.getElementById('gestor-wizard-msgs');
    const form = document.getElementById('gestor-wizard-form');
    const input = document.getElementById('gestor-wizard-input');
    const statusEl = document.getElementById('gestor-wizard-status');
    const btnLimpar = document.getElementById('gestor-wizard-limpar');
    const btnFechar = document.getElementById('gestor-wizard-fechar');
    const barra = document.getElementById('gestor-wizard-barra');
    const barraTxt = document.getElementById('gestor-wizard-barra-txt');
    const barraBtn = document.getElementById('gestor-wizard-barra-btn');
    const barraRecusar = document.getElementById('gestor-wizard-barra-recusar');
    const fileInput = document.getElementById('gestor-wizard-file');
    const btnAnexar = document.getElementById('gestor-wizard-anexar');
    const filesEl = document.getElementById('gestor-wizard-files');
    if (!fab || !panel || !form) return;

    const urlChat = '{% url "wizard_chat" %}';
    const urlLimpar = '{% url "wizard_chat_limpar" %}';
    const csrf = '{{ csrf_token }}';
    let arquivosPendentes = [];

    function csrfToken() {
        var m = document.cookie.match(/(?:^|; )csrftoken=([^;]+)/);
        return m ? decodeURIComponent(m[1]) : csrf;
    }

    function snapshotPagina() {
        const main = document.getElementById('main-content');
        const pedacos = [];
        if (main) {
            main.querySelectorAll('table').forEach(function (t) {
                const txt = (t.innerText || '').trim();
                if (txt) pedacos.push(txt);
            });
        }
        let ticketId = null;
        const elTicket = document.querySelector('[data-ticket-id]');
        if (elTicket) {
            const n = parseInt(elTicket.getAttribute('data-ticket-id'), 10);
            if (!isNaN(n)) ticketId = n;
        }
        return {
            path: window.location.pathname,
            query: window.location.search || '',
            title: document.title || '',
            tabelas: pedacos.join('\n\n').slice(0, 8000),
            ticket_id: ticketId,
        };
    }

    function escHtml(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function addMsg(role, html, text) {
        msgs.classList.add('has-msgs');
        const wrap = document.createElement('div');
        wrap.className = 'gestor-wizard-msg ' + (role === 'user'
            ? 'gestor-wizard-msg-user'
            : 'gestor-wizard-msg-assistant memoria-md');
        if (html) wrap.innerHTML = html;
        else wrap.textContent = text || '';
        const card = msgs.querySelector('.gestor-wizard-plano-card');
        if (card) msgs.insertBefore(wrap, card);
        else msgs.appendChild(wrap);
        msgs.scrollTop = msgs.scrollHeight;
    }

    function resumoPlanoItem(item) {
        const tool = (item && item.tool) || '';
        const args = (item && item.args) || {};
        if (tool === 'atualizar_acesso_discador') {
            return {
                ramal: args.ramal_numero || args.acesso_id || '—',
                de: '—',
                para: args.titular_nome || '—',
                acao: 'Corrigir nome',
            };
        }
        if (tool === 'atualizar_contrato_discador') {
            return {
                ramal: 'Licenças',
                de: '—',
                para: args.licencas_contratadas != null ? String(args.licencas_contratadas) : '—',
                acao: 'Atualizar contrato',
            };
        }
        let json = '';
        try { json = JSON.stringify(args); } catch (e) { json = ''; }
        if (json.length > 72) json = json.slice(0, 69) + '…';
        return {
            ramal: args.ramal_numero || args.numero || args.acesso_id || '—',
            de: '—',
            para: json || '—',
            acao: tool || 'alteração',
        };
    }

    function pintarPlano(plano, aguardando) {
        const lista = Array.isArray(plano) ? plano : [];
        const show = !!aguardando;
        let card = msgs.querySelector('.gestor-wizard-plano-card');
        if (!show) {
            if (card) card.remove();
            barra.classList.remove('is-on');
            return;
        }
        msgs.classList.add('has-msgs');
        const n = lista.length;
        const rotulo = n === 1 ? '1 alteração' : (n ? n + ' alterações' : 'Plano pendente');
        if (!card) {
            card = document.createElement('div');
            card.className = 'gestor-wizard-plano-card';
            msgs.appendChild(card);
        }
        let tabela = '';
        if (n) {
            const linhas = lista.map(function (item) {
                const r = resumoPlanoItem(item);
                return '<tr><td>' + escHtml(r.ramal) + '</td><td>' + escHtml(r.de) +
                    '</td><td>' + escHtml(r.para) + '</td><td>' + escHtml(r.acao) + '</td></tr>';
            }).join('');
            tabela = '<div class="memoria-md-table-wrap"><table class="memoria-md-table">' +
                '<thead><tr><th>Item</th><th>De</th><th>Para</th><th>Ação</th></tr></thead>' +
                '<tbody>' + linhas + '</tbody></table></div>';
        }
        const titulo = n ? 'Plano (' + rotulo + ')' : 'Confirmar ou recusar este plano';
        card.innerHTML =
            '<h3>' + titulo + '</h3>' + tabela +
            '<div class="gestor-wizard-acoes">' +
            '<button type="button" class="gestor-wizard-recusar" data-recusar="1">Recusar</button>' +
            '<button type="button" class="gestor-wizard-cta" data-confirmar="1">Confirmar</button>' +
            '</div>';
        barraTxt.textContent = n ? (rotulo + ' pronta' + (n === 1 ? '' : 's') + ' para executar') : 'Confirme ou recuse o plano';
        barra.classList.add('is-on');
        msgs.scrollTop = msgs.scrollHeight;
    }

    function confirmarPlano() { enviar('confirma', 'Confirmei o plano'); }
    function recusarPlano() { enviar('recusar', 'Recusei o plano'); }

    function setBusy(on) {
        statusEl.classList.toggle('is-on', !!on);
        form.querySelector('button[type="submit"]').disabled = !!on;
        input.disabled = !!on;
        if (barraBtn) barraBtn.disabled = !!on;
        if (barraRecusar) barraRecusar.disabled = !!on;
        msgs.querySelectorAll('.gestor-wizard-cta, .gestor-wizard-recusar').forEach(function (b) { b.disabled = !!on; });
    }

    function abrir() {
        panel.classList.add('is-open');
        fab.setAttribute('aria-expanded', 'true');
        try { localStorage.setItem('gestor-wizard-open', '1'); } catch (e) {}
        input.focus();
    }

    function fechar() {
        panel.classList.remove('is-open');
        fab.setAttribute('aria-expanded', 'false');
        try { localStorage.setItem('gestor-wizard-open', '0'); } catch (e) {}
    }

    fab.addEventListener('click', function () {
        if (panel.classList.contains('is-open')) fechar();
        else abrir();
    });
    btnFechar.addEventListener('click', fechar);

    function pintarArquivos() {
        if (!arquivosPendentes.length) {
            filesEl.hidden = true;
            filesEl.innerHTML = '';
            return;
        }
        filesEl.hidden = false;
        filesEl.innerHTML = arquivosPendentes.map(function (f, i) {
            return '<span class="gestor-wizard-chip">' +
                (f.name || 'arquivo') +
                ' <button type="button" data-i="' + i + '" title="Remover">&times;</button></span>';
        }).join('');
    }

    function lerArquivo(file) {
        return new Promise(function (resolve, reject) {
            if (file.size > 5 * 1024 * 1024) {
                reject(new Error((file.name || 'arquivo') + ' passa de 5 MB'));
                return;
            }
            const reader = new FileReader();
            reader.onload = function () {
                const dataUrl = String(reader.result || '');
                const b64 = dataUrl.split(',')[1] || '';
                resolve({ nome: file.name, mime: file.type || '', data_base64: b64 });
            };
            reader.onerror = function () { reject(new Error('Falha ao ler ' + file.name)); };
            reader.readAsDataURL(file);
        });
    }

    btnAnexar.addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', function () {
        const lista = Array.prototype.slice.call(fileInput.files || []);
        lista.forEach(function (f) {
            if (arquivosPendentes.length >= 4) return;
            arquivosPendentes.push(f);
        });
        fileInput.value = '';
        pintarArquivos();
    });
    filesEl.addEventListener('click', function (e) {
        const btn = e.target.closest('button[data-i]');
        if (!btn) return;
        arquivosPendentes.splice(parseInt(btn.getAttribute('data-i'), 10), 1);
        pintarArquivos();
    });

    function enviar(texto, rotuloVisivel) {
        const mensagem = (texto || '').trim();
        const pendentes = arquivosPendentes.slice();
        if (!mensagem && !pendentes.length) return;
        const rotulo = rotuloVisivel || mensagem || ('📎 ' + pendentes.map(function (f) { return f.name; }).join(', '));
        addMsg('user', '', rotulo + (!rotuloVisivel && mensagem && pendentes.length ? '\n📎 ' + pendentes.map(function (f) { return f.name; }).join(', ') : ''));
        input.value = '';
        arquivosPendentes = [];
        pintarArquivos();
        setBusy(true);
        Promise.all(pendentes.map(lerArquivo)).then(function (anexos) {
            return fetch(urlChat, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken(),
                    'X-Requested-With': 'XMLHttpRequest',
                },
                credentials: 'same-origin',
                body: JSON.stringify({
                    message: mensagem,
                    pagina: snapshotPagina(),
                    anexos: anexos,
                }),
            }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); });
        }).then(function (res) {
            if (!res.ok || !res.d.ok) {
                addMsg('assistant', '', (res.d && res.d.error) || 'Falha no wizard.');
                pintarPlano([], false);
                return;
            }
            addMsg('assistant', res.d.reply_html || '', res.d.reply || '');
            pintarPlano(res.d.plano, res.d.aguardando_confirmacao);
        }).catch(function (err) {
            addMsg('assistant', '', err && err.message ? err.message : 'Falha de rede ao falar com o wizard.');
            pintarPlano([], false);
        }).finally(function () { setBusy(false); input.focus(); });
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        enviar(input.value);
    });
    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            enviar(input.value);
        }
    });
    barraBtn.addEventListener('click', confirmarPlano);
    if (barraRecusar) barraRecusar.addEventListener('click', recusarPlano);
    msgs.addEventListener('click', function (e) {
        if (e.target.closest('[data-confirmar]')) confirmarPlano();
        else if (e.target.closest('[data-recusar]')) recusarPlano();
    });
    btnLimpar.addEventListener('click', function () {
        fetch(urlLimpar, {
            method: 'POST',
            headers: { 'X-CSRFToken': csrfToken(), 'X-Requested-With': 'XMLHttpRequest' },
            credentials: 'same-origin',
        }).then(function () {
            msgs.innerHTML = '<div id="gestor-wizard-vazio"><i class="fa-regular fa-comments"></i>Conversa limpa. Pode pedir de novo.</div>';
            msgs.classList.remove('has-msgs');
            pintarPlano([], false);
        });
    });

    fetch(urlChat, { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
        .then(function (r) { return r.json(); })
        .then(function (d) {
            (d.messages || []).forEach(function (m) {
                if (m.role === 'assistant') addMsg('assistant', m.content_html || '', m.content || '');
                else addMsg('user', '', m.content || '');
            });
            pintarPlano(d.plano, d.aguardando_confirmacao);
        }).catch(function () {});

    try {
        if (localStorage.getItem('gestor-wizard-open') === '1') abrir();
    } catch (e) {}
})();
</script>
