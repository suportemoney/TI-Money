<style>
    /* Estilos base da Sidebar (Escala Ampliada) */
    #app-sidebar {
        width: 18.5rem; /* 296px quando aberto */
        transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        background: #ffffff;
        border-right: 1px solid rgba(226, 232, 240, 0.8);
    }

    html.sidebar-collapsed #app-sidebar {
        width: 5.5rem; /* 88px quando retraído */
    }

    #app-sidebar .sidebar-hide-collapsed {
        transition: opacity 0.2s ease, width 0.2s ease;
    }

    html.sidebar-collapsed #app-sidebar .sidebar-hide-collapsed {
        opacity: 0;
        width: 0;
        overflow: hidden;
        white-space: nowrap;
        pointer-events: none;
    }

    /* Ajuste de logo e cabeçalho no estado colapsado */
    html.sidebar-collapsed #app-sidebar .sidebar-logo-wrap {
        justify-content: center;
        padding-left: 0;
        padding-right: 0;
    }

    html.sidebar-collapsed #app-sidebar .sidebar-user-wrap {
        justify-content: center;
    }

    /* Ajuste do container de scroll no estado colapsado (evita que a scrollbar cubra os ícones) */
    html.sidebar-collapsed #app-sidebar .sidebar-nav-scroll {
        padding-left: 0.6rem;
        padding-right: 0.4rem; /* Menos padding na direita para criar zona de escape da barra */
    }

    /* Estilização das Categorias / Divisores */
    .sidebar-category-header {
        transition: all 0.3s ease;
        display: block;
    }

    /* Categorias no estado colapsado: alinhadas à esquerda e menor (8px) */
    html.sidebar-collapsed #app-sidebar .sidebar-category-header {
        text-align: left !important;
        font-size: 8px !important;
        font-weight: 700 !important;
        color: rgb(156 163 175) !important; /* text-gray-400 */
        padding-left: 0.75rem !important; /* Alinha com a borda esquerda dos botões */
        padding-right: 0.25rem !important;
        margin-top: 1.25rem !important;
        margin-bottom: 0.375rem !important;
        letter-spacing: 0.05em !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
        white-space: nowrap !important;
    }

    /* Efeitos de item ativo SUAVE (Sem Liquid Glass) */
    .sidebar-nav-link-active {
        background: rgba(37, 99, 235, 0.05) !important;
        color: #2563eb !important;
        font-weight: 600 !important;
        border-radius: 0.5rem !important;
    }

    .sidebar-nav-link-active .sidebar-nav-icon {
        color: #2563eb !important;
    }

    /* Espaçamentos, transições e fontes em modo normal */
    .sidebar-nav-link {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid transparent;
        font-size: 1rem; /* 16px */
        padding: 0.75rem 1rem !important;
        margin-bottom: 0.25rem;
        display: flex;
        align-items: center;
        border-radius: 0.5rem;
        width: 100%;
    }

    .sidebar-link-label {
        font-size: 1rem;
        transition: all 0.2s ease;
    }

    /* Ícones quando aberto */
    .sidebar-nav-icon svg {
        width: 1.625rem !important; /* 26px */
        height: 1.625rem !important; /* 26px */
    }

    /* ESTADO RETRAÍDO: Ícone e Texto empilhados verticalmente e centralizados */
    html.sidebar-collapsed #app-sidebar .sidebar-nav-link {
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        text-align: center !important;
        gap: 0.25rem !important; /* Espaço entre ícone e texto */
        padding: 0.5rem 0.25rem !important; /* Compacta a altura */
        margin-bottom: 0.375rem !important;
        border-radius: 0.5rem !important;
    }

    /* Texto do link no estado colapsado */
    html.sidebar-collapsed #app-sidebar .sidebar-link-label {
        display: block !important;
        font-size: 9px !important;
        font-weight: 500 !important;
        line-height: 1.2 !important;
        text-align: center !important;
        max-width: 100% !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
        white-space: nowrap !important;
    }

    /* Centralização dos ícones no estado colapsado */
    html.sidebar-collapsed #app-sidebar .sidebar-nav-icon {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        margin: 0 !important;
    }

    /* Rotação do ícone colapsar/expandir */
    html.sidebar-collapsed #sidebar-toggle-icon {
        transform: rotate(180deg);
    }

    #sidebar-toggle-icon {
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* BARRA DE ROLAGEM CUSTOMIZADA E ULTRA-FINA GLOBAL */
    ::-webkit-scrollbar {
        width: 4px !important; /* Apenas 4px de largura */
        height: 4px !important; /* Apenas 4px de altura */
    }

    ::-webkit-scrollbar-track {
        background: transparent !important;
    }

    ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.2) !important; /* Cinza claro bem sutil */
        border-radius: 4px !important;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.4) !important;
    }

    /* Firefox */
    * {
        scrollbar-width: thin !important;
        scrollbar-color: rgba(148, 163, 184, 0.2) transparent !important;
    }

    /* Wizard flutuante: CSS no head (nao no body flex). Caixa 0x0 para nao
       ocupar coluna do layout; FAB/painel saem com overflow visivel. */
    #gestor-wizard-root {
        position: fixed !important;
        right: 1.5rem !important;
        bottom: 1.5rem !important;
        z-index: 45 !important;
        width: 0 !important;
        height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
        flex: 0 0 0 !important;
        min-width: 0 !important;
        min-height: 0 !important;
        pointer-events: none;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    #gestor-wizard-fab,
    #gestor-wizard-panel {
        pointer-events: auto;
    }
    #gestor-wizard-fab {
        position: absolute;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 4rem;
        height: 4rem;
        border: 0;
        border-radius: 9999px;
        background: #2563eb;
        color: #fff;
        font-size: 1.25rem;
        box-shadow: 0 12px 28px -6px rgb(37 99 235 / 0.55);
        cursor: pointer;
        transition: background 0.15s ease, transform 0.15s ease;
    }
    #gestor-wizard-fab:hover { background: #1d4ed8; transform: scale(1.04); }
    #gestor-wizard-fab[aria-expanded="true"] { background: #1e40af; }
    #gestor-wizard-panel {
        display: none;
        position: absolute;
        right: 0;
        bottom: 5rem;
        width: min(28rem, calc(100vw - 2rem));
    }
    #gestor-wizard-panel.is-open { display: block; }
    #gestor-wizard-sheet {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: min(78vh, 40rem);
        min-height: 28rem;
        overflow: hidden;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 1.25rem;
        box-shadow: 0 25px 50px -12px rgb(15 23 42 / 0.28);
    }
    #gestor-wizard-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 1rem 1.1rem 0.9rem;
        background: linear-gradient(180deg, #f8fafc 0%, #fff 100%);
        border-bottom: 1px solid #e2e8f0;
    }
    #gestor-wizard-header-left {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        min-width: 0;
    }
    #gestor-wizard-badge {
        flex-shrink: 0;
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 0.75rem;
        background: #eff6ff;
        color: #2563eb;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
    }
    #gestor-wizard-header h2 {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 700;
        color: #0f172a;
        line-height: 1.25;
    }
    #gestor-wizard-header p {
        margin: 0.2rem 0 0;
        font-size: 0.8rem;
        color: #64748b;
        line-height: 1.3;
    }
    #gestor-wizard-actions {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        flex-shrink: 0;
    }
    #gestor-wizard-confirmar,
    #gestor-wizard-limpar,
    #gestor-wizard-fechar {
        border: 0;
        cursor: pointer;
        font-weight: 600;
        border-radius: 0.6rem;
        font-size: 0.8rem;
        line-height: 1;
    }
    #gestor-wizard-confirmar {
        background: #ecfdf5;
        color: #047857;
        padding: 0.5rem 0.7rem;
    }
    #gestor-wizard-confirmar:hover { background: #d1fae5; }
    #gestor-wizard-limpar {
        background: #f1f5f9;
        color: #475569;
        padding: 0.5rem 0.7rem;
    }
    #gestor-wizard-limpar:hover { background: #e2e8f0; }
    #gestor-wizard-fechar {
        width: 2rem;
        height: 2rem;
        background: transparent;
        color: #94a3b8;
        font-size: 1.1rem;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #gestor-wizard-fechar:hover { background: #f1f5f9; color: #334155; }
    #gestor-wizard-msgs {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 1rem 1.1rem;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
        background: #f8fafc;
        min-height: 0;
    }
    #gestor-wizard-vazio {
        margin: auto;
        text-align: center;
        color: #64748b;
        font-size: 0.9rem;
        line-height: 1.45;
        max-width: 16rem;
        padding: 1.5rem 0.5rem;
    }
    #gestor-wizard-vazio i {
        display: block;
        font-size: 1.5rem;
        color: #93c5fd;
        margin-bottom: 0.6rem;
    }
    #gestor-wizard-msgs.has-msgs #gestor-wizard-vazio { display: none; }
    .gestor-wizard-msg {
        max-width: 92%;
        padding: 0.7rem 0.9rem;
        border-radius: 1rem;
        font-size: 0.92rem;
        line-height: 1.45;
        color: #1e293b;
        word-break: break-word;
    }
    .gestor-wizard-msg-user {
        align-self: flex-end;
        background: #dbeafe;
        border-bottom-right-radius: 0.3rem;
    }
    .gestor-wizard-msg-assistant {
        align-self: flex-start;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-bottom-left-radius: 0.3rem;
    }
    #gestor-wizard-form {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
        padding: 0.9rem 1.1rem 1rem;
        border-top: 1px solid #e2e8f0;
        background: #fff;
    }
    #gestor-wizard-input {
        width: 100%;
        min-height: 4.75rem;
        resize: none;
        font-size: 0.95rem;
        line-height: 1.4;
        padding: 0.75rem 0.85rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.85rem;
        outline: none;
        color: #0f172a;
        box-sizing: border-box;
        font-family: inherit;
    }
    #gestor-wizard-input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgb(59 130 246 / 0.2);
    }
    #gestor-wizard-form-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
    }
    #gestor-wizard-hint {
        margin: 0;
        font-size: 0.72rem;
        color: #94a3b8;
    }
    #gestor-wizard-enviar {
        border: 0;
        background: #2563eb;
        color: #fff;
        font-size: 0.88rem;
        font-weight: 700;
        padding: 0.55rem 1.05rem;
        border-radius: 0.7rem;
        cursor: pointer;
    }
    #gestor-wizard-enviar:hover { background: #1d4ed8; }
    #gestor-wizard-enviar:disabled,
    #gestor-wizard-input:disabled {
        opacity: 0.55;
        cursor: not-allowed;
    }
    #gestor-wizard-status {
        display: none;
        margin: 0;
        padding: 0 1.1rem 0.85rem;
        font-size: 0.78rem;
        color: #64748b;
        background: #fff;
    }
    #gestor-wizard-status.is-on { display: block; }
</style>
